<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Auth - Key 模式增量 UI 预览</title>
  <style>
    :root {
      color-scheme: light;
      --stage: #25272b;
      --surface: #f8f9fb;
      --surface-soft: #f0f2f5;
      --surface-muted: #e6e8ec;
      --line: #dfe2e7;
      --text: #292c31;
      --muted: #70757d;
      --blue: #3478ea;
      --blue-soft: #e2ebff;
      --orange: #ee8b35;
      --red: #d54941;
      --green: #278b55;
      --radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--text);
      background: var(--stage);
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }

    .preview-controls {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      justify-content: center;
      padding: 14px;
      background: rgb(37 39 43 / 90%);
      backdrop-filter: blur(18px);
    }
    .preview-segment {
      display: inline-flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 10px;
      background: #34373c;
    }
    .preview-segment button {
      min-width: 92px;
      padding: 6px 11px;
      border: 0;
      border-radius: 7px;
      color: #c4c8ce;
      background: transparent;
    }
    .preview-segment button.active { color: #202328; background: #f5f6f8; }
    .preview-page { display: none; min-height: calc(100vh - 63px); padding: 26px; }
    .preview-page.active { display: grid; place-items: start center; }

    .popover {
      position: relative;
      width: 430px;
      min-height: 690px;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 45%);
      border-radius: 27px;
      background: #eef1f5;
      box-shadow: 0 24px 60px rgb(0 0 0 / 34%);
    }
    .popover::before {
      content: "";
      position: absolute;
      top: -10px;
      left: calc(50% - 10px);
      width: 20px;
      height: 20px;
      background: #eef1f5;
      transform: rotate(45deg);
    }
    .popover-inner { position: relative; z-index: 1; padding: 19px 14px 8px; }
    .menu-header h1 { font-size: 25px; font-weight: 650; }
    .cpa-state {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 3px;
      color: var(--muted);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
    .smart-launch {
      width: 100%;
      min-height: 42px;
      margin-top: 15px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--blue);
      font-size: 16px;
      font-weight: 600;
    }
    .direct-launch {
      width: 100%;
      min-height: 36px;
      margin-top: 7px;
      border: 1px solid #c9d0da;
      border-radius: 12px;
      color: #4d5662;
      background: rgb(255 255 255 / 62%);
      font-size: 14px;
      font-weight: 560;
    }
    .availability { margin: 5px 0 10px; color: var(--muted); text-align: center; }
    .menu-toolbar {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
    }
    .compact-select, .type-picker {
      height: 31px;
      border: 0;
      border-radius: 7px;
      color: #4c5158;
      background: #dde1e6;
    }
    .compact-select { padding: 0 8px; }
    .type-picker { padding: 0 7px; }
    .today { justify-self: end; color: var(--muted); font-weight: 580; }
    .refresh {
      width: 30px;
      height: 30px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 21px;
    }
    .menu-list {
      height: 430px;
      margin-top: 8px;
      overflow-y: auto;
      scrollbar-color: #92969c transparent;
      scrollbar-width: thin;
    }
    .menu-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      min-height: 102px;
      padding: 11px 15px;
      border: 0;
      border-radius: 9px;
      color: var(--text);
      text-align: left;
      background: transparent;
    }
    .menu-row:hover { background: rgb(52 120 234 / 6%); }
    .menu-row.selected.available, .list-row.selected.available { background: rgb(52 120 234 / 16%); }
    .menu-row.selected.unavailable, .list-row.selected.unavailable { background: rgb(213 73 65 / 15%); }
    .row-icon {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      margin-top: 2px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .row-icon.apikey { border-radius: 7px; color: #b06828; border-color: #b06828; }
    .row-title { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 620; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 6px;
      color: #5e636a;
      background: #dfe2e6;
      font-size: 12px;
      font-weight: 500;
    }
    .badge.apikey { color: #9c5c24; background: #f6e7d9; }
    .row-line { display: block; margin-top: 2px; color: var(--muted); }
    .row-line .danger { color: var(--red); }
    .row-line .balance { color: var(--green); font-weight: 590; }
    .row-line.balance { color: var(--green); font-weight: 590; }
    .menu-footer {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }
    .footer-action {
      padding: 5px 1px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
    }
    .footer-action span { display: block; margin-bottom: 2px; font-size: 20px; line-height: 1; }

    .management {
      width: min(1180px, calc(100vw - 36px));
      min-height: 720px;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 45%);
      border-radius: 25px;
      background: var(--surface);
      box-shadow: 0 25px 65px rgb(0 0 0 / 38%);
    }
    .titlebar {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      min-height: 66px;
      border-bottom: 1px solid var(--line);
    }
    .traffic-title {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 20px;
      font-size: 18px;
      font-weight: 640;
    }
    .traffic { display: inline-flex; gap: 9px; }
    .traffic i { display: block; width: 14px; height: 14px; border-radius: 50%; background: #f2635f; }
    .traffic i:nth-child(2) { background: #f2bd3b; }
    .traffic i:nth-child(3) { background: #58be68; }
    .window-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px 8px 0;
    }
    .toolbar-button, .toolbar-select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #4f545b;
      background: #fff;
    }
    .toolbar-button { min-width: 42px; padding: 0 12px; font-size: 19px; }
    .toolbar-select { padding: 0 12px; }
    .toolbar-search {
      min-width: 180px;
      height: 38px;
      flex: 1;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: 0;
      background: #fff;
    }
    .toolbar-search:focus { border-color: #9ebcf1; box-shadow: 0 0 0 3px rgb(52 120 234 / 10%); }
    .window-body { display: grid; grid-template-columns: 200px 250px minmax(0, 1fr); min-height: 654px; }
    .nav-column { padding: 15px 11px; border-right: 1px solid var(--line); background: #f3f4f6; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      min-height: 43px;
      padding: 0 13px;
      border: 0;
      border-radius: 9px;
      color: var(--text);
      text-align: left;
      background: transparent;
      font-size: 15px;
      font-weight: 580;
    }
    .nav-item.active { color: #fff; background: var(--blue); }
    .nav-item span { width: 20px; text-align: center; font-size: 17px; }
    .list-column { border-right: 1px solid var(--line); overflow-y: auto; background: #fff; }
    .list-row {
      display: block;
      width: 100%;
      min-height: 72px;
      padding: 9px 13px;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      text-align: left;
      background: transparent;
    }
    .list-row:hover { background: #f2f6fc; }
    .list-row.selected { background: var(--blue-soft); }
    .list-row-head { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 610; }
    .list-row-head .check { margin-left: auto; color: var(--blue); }
    .list-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .detail-column { min-width: 0; padding: 34px 31px; background: #fff; }
    .profile { display: flex; align-items: center; gap: 15px; }
    .profile-avatar {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      color: var(--blue);
      background: var(--blue-soft);
      font-size: 24px;
      font-weight: 650;
    }
    .profile-avatar.apikey { border-radius: 15px; color: #a75f24; background: #f6e7d9; }
    .profile-title { display: flex; align-items: center; gap: 9px; }
    .profile-title h2 { font-size: 21px; font-weight: 650; }
    .profile-subtitle { margin-top: 3px; color: var(--muted); font-size: 15px; }
    .facts { display: grid; grid-template-columns: 130px minmax(0, 1fr); row-gap: 13px; margin-top: 27px; font-size: 16px; }
    .facts .label { font-weight: 620; }
    .facts .value.balance { color: var(--green); font-size: 21px; font-weight: 650; }
    .divider { height: 1px; margin: 24px 0 20px; background: var(--line); }
    .connection-heading { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 620; }
    .primary-button, .secondary-button {
      min-height: 34px;
      padding: 0 13px;
      border: 0;
      border-radius: 8px;
      color: var(--text);
      background: var(--surface-muted);
    }
    .primary-button { color: #fff; background: var(--blue); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 16px; }
    .setting-label { display: grid; gap: 2px; }
    .setting-label small { color: var(--muted); font-size: 12px; }
    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 11px;
      background: #c8ccd2;
      transition: background 150ms ease;
    }
    .switch span::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgb(0 0 0 / 20%);
      transition: transform 150ms ease;
    }
    .switch input:checked + span { background: var(--blue); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .alias-label { display: block; margin-top: 25px; font-size: 16px; font-weight: 620; }
    .alias-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-top: 8px; }
    .alias-row input {
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
    }
    .detail-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .detail-actions time { color: var(--muted); }
    .detail-actions div { display: flex; gap: 8px; }

    .window-body.routing { grid-template-columns: 200px minmax(0, 1fr); }
    .window-body.routing .list-column { display: none; }
    .window-body.routing .detail-column { padding: 0; }
    .routing-detail { padding: 28px 30px; }
    .routing-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .routing-header h2 { font-size: 21px; font-weight: 650; }
    .routing-header p { margin-top: 3px; color: var(--muted); }
    .routing-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
    .routing-metric { padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .routing-metric small { display: block; color: var(--muted); }
    .routing-metric strong { display: block; margin-top: 4px; font-size: 15px; }
    .pool-heading { margin-top: 25px; font-size: 16px; font-weight: 620; }
    .pool-table { margin-top: 9px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .pool-row { display: grid; grid-template-columns: minmax(160px, 1fr) 90px 120px 24px; gap: 12px; align-items: center; min-height: 54px; padding: 8px 13px; border-bottom: 1px solid var(--line); }
    .pool-row:last-child { border-bottom: 0; }
    .pool-name { display: grid; gap: 2px; }
    .pool-name small { color: var(--muted); }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

    .modal-backdrop {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgb(20 22 25 / 48%);
      backdrop-filter: blur(8px);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(520px, calc(100vw - 32px));
      padding: 25px;
      border: 1px solid rgb(255 255 255 / 60%);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 70px rgb(0 0 0 / 30%);
    }
    .modal-header { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
    .modal-header h2 { font-size: 21px; font-weight: 650; }
    .modal-header p { margin-top: 4px; color: var(--muted); }
    .modal-close { border: 0; color: var(--muted); background: transparent; font-size: 22px; }
    .modal-options { display: grid; gap: 10px; margin-top: 24px; }
    .modal-option {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 20px;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-align: left;
      background: #fff;
    }
    .modal-option:hover { border-color: #9ebcf1; background: #f7faff; }
    .modal-option-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--blue); background: var(--blue-soft); font-weight: 700; }
    .modal-option-icon.key { border-radius: 10px; color: #a75f24; background: #f6e7d9; }
    .modal-option strong, .modal-option small { display: block; }
    .modal-option small { margin-top: 3px; color: var(--muted); }
    .modal-option-arrow { color: var(--muted); font-size: 20px; }
    .modal-form { display: grid; gap: 14px; margin-top: 22px; }
    .form-field { display: grid; gap: 6px; }
    .form-field label { font-weight: 600; }
    .form-field input, .form-field select { height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: #fff; }
    .form-field input:focus, .form-field select:focus { border-color: #9ebcf1; box-shadow: 0 0 0 3px rgb(52 120 234 / 10%); }
    .form-hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .form-status { min-height: 18px; color: var(--green); font-size: 12px; }

    @media (max-width: 820px) {
      .preview-page { padding: 15px; }
      .management { width: 100%; min-height: 680px; }
      .titlebar { grid-template-columns: 1fr; }
      .traffic-title { display: none; }
      .window-toolbar { padding-left: 12px; }
      .window-body { grid-template-columns: 62px 210px minmax(0, 1fr); }
      .window-body.routing { grid-template-columns: 62px minmax(0, 1fr); }
      .nav-column { padding-inline: 8px; }
      .nav-item { justify-content: center; padding: 0; }
      .nav-item strong { display: none; }
      .detail-column { padding: 26px 21px; }
    }
    @media (max-width: 620px) {
      .preview-page[data-page="management"] { place-items: start; overflow-x: auto; }
      .management { min-width: 860px; }
      .popover { width: min(430px, calc(100vw - 24px)); }
    }
  </style>
</head>
<body>
  <div class="preview-controls">
    <div class="preview-segment" role="tablist" aria-label="预览页面">
      <button class="active" type="button" data-page-button="menu">菜单栏</button>
      <button type="button" data-page-button="management">管理窗口</button>
    </div>
  </div>

  <section class="preview-page active" data-page="menu">
    <div class="popover">
      <div class="popover-inner">
        <header class="menu-header">
          <h1>Codex Auth</h1>
          <div class="cpa-state"><span class="dot"></span>CPA 已连接</div>
        </header>
        <button class="smart-launch" type="button">智能启动 Codex</button>
        <button class="direct-launch" type="button">直连启动 Codex</button>
        <div class="availability" id="availability">4 / 5 个连接可用</div>
        <div class="menu-toolbar">
          <select class="compact-select" aria-label="排序">
            <option>额度</option>
            <option>默认</option>
            <option>最近</option>
          </select>
          <select class="type-picker" id="menu-type" aria-label="认证类型">
            <option value="all">全部</option>
            <option value="chatgpt">账号</option>
            <option value="apikey">Key</option>
          </select>
          <span class="today">今日 46.5M</span>
          <button class="refresh" type="button" title="刷新" aria-label="刷新">↻</button>
        </div>
        <div class="menu-list" id="menu-list"></div>
        <footer class="menu-footer">
          <button class="footer-action" type="button" data-open-add><span>＋</span>添加</button>
          <button class="footer-action" type="button" data-open-management><span>♙</span>管理</button>
          <button class="footer-action" type="button"><span>▥</span>统计</button>
          <button class="footer-action" type="button"><span>⚙</span>设置</button>
          <button class="footer-action" type="button"><span>⏻</span>退出</button>
        </footer>
      </div>
    </div>
  </section>

  <section class="preview-page" data-page="management">
    <div class="management">
      <header class="titlebar">
        <div class="traffic-title">
          <span class="traffic"><i></i><i></i><i></i></span>
          <span id="management-title">连接</span>
        </div>
        <div class="window-toolbar">
          <button class="toolbar-button" type="button" title="显示侧栏" aria-label="显示侧栏">▣</button>
          <select class="toolbar-select" data-connection-tool aria-label="排序"><option>默认</option><option>额度</option><option>最近</option></select>
          <select class="toolbar-select" id="window-type" data-connection-tool aria-label="认证类型">
            <option value="all">全部</option>
            <option value="chatgpt">账号</option>
            <option value="apikey">Key</option>
          </select>
          <button class="toolbar-button" type="button" title="刷新" aria-label="刷新">↻</button>
          <button class="toolbar-button" data-connection-tool data-open-add type="button" title="添加" aria-label="添加">＋</button>
          <input class="toolbar-search" id="window-search" data-connection-tool type="search" placeholder="搜索账号或 Key">
        </div>
      </header>
      <div class="window-body">
        <nav class="nav-column" aria-label="管理导航">
          <button class="nav-item active" type="button" data-management-section="connections"><span>♙</span><strong>连接</strong></button>
          <button class="nav-item" type="button" data-management-section="routing"><span>⌘</span><strong>路由</strong></button>
          <button class="nav-item" type="button"><span>▥</span><strong>统计</strong></button>
          <button class="nav-item" type="button"><span>⚙</span><strong>设置</strong></button>
        </nav>
        <aside class="list-column" id="window-list"></aside>
        <main class="detail-column" id="window-detail" aria-live="polite"></main>
      </div>
    </div>
  </section>

  <div class="modal-backdrop" id="add-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <div><h2 id="modal-title">添加连接</h2><p id="modal-subtitle">选择要添加的连接类型</p></div>
        <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
      </header>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const profiles = [
      {
        id: "main", kind: "chatgpt", icon: "●", name: "主号", badge: "Plus", meta: "28***@qq.com",
        active: true, inPool: true, available: false,
        menuLines: ["5 小时 72%（18:20 刷新）", "7 天 <span class=\"danger\">0%</span>（8 月 5 日 12:32 刷新）"],
        facts: [["5 小时", "72%（18:20 刷新）"], ["7 天", "0%（8 月 5 日 12:32 刷新）"], ["重置机会", "重置 1 次 · 最近到期 8 月 13 日 01:40"]]
      },
      {
        id: "product-a", kind: "chatgpt", icon: "●", name: "成品 A", badge: "Plus", meta: "st***@outlook.com",
        active: false, inPool: true, available: true,
        menuLines: ["5 小时 91%（17:45 刷新）", "7 天 48%（8 月 5 日 19:58 刷新）"],
        facts: [["5 小时", "91%（17:45 刷新）"], ["7 天", "48%（8 月 5 日 19:58 刷新）"], ["重置机会", "重置 0 次"]]
      },
      {
        id: "assistant", kind: "chatgpt", icon: "●", name: "辅号", badge: "Free", meta: "li***@163.com",
        active: false, inPool: false, available: true,
        menuLines: ["5 小时 未知", "7 天 未知"],
        facts: [["5 小时", "未知"], ["7 天", "未知"], ["重置机会", "重置 1 次"]]
      },
      {
        id: "relay", kind: "apikey", icon: "K", name: "AI 系统", badge: "Key", meta: "api.zzzcoding.org",
        balance: "999.98 USD", active: false, inPool: true, available: true,
        menuLines: ["<span class=\"balance\">余额 999.98 USD</span>", "3 分钟前更新"],
        facts: [["余额", "999.98 USD"], ["Endpoint", "https://api.zzzcoding.org/v1"]]
      },
      {
        id: "official-api", kind: "apikey", icon: "K", name: "OpenAI API", badge: "Key", meta: "sk-proj-••••••9F2A",
        active: false, inPool: false, available: true,
        menuLines: ["OpenAI API Key", "api.openai.com"],
        facts: [["Endpoint", "https://api.openai.com/v1"], ["API Key", "sk-proj-••••••9F2A"]]
      }
    ];

    let selectedId = "main";
    const menuList = document.getElementById("menu-list");
    const windowList = document.getElementById("window-list");
    const windowDetail = document.getElementById("window-detail");
    const windowBody = document.querySelector(".window-body");
    const managementTitle = document.getElementById("management-title");
    const availability = document.getElementById("availability");
    const menuType = document.getElementById("menu-type");
    const windowType = document.getElementById("window-type");
    const windowSearch = document.getElementById("window-search");
    let managementSection = "connections";
    const addModal = document.getElementById("add-modal");
    const modalTitle = document.getElementById("modal-title");
    const modalSubtitle = document.getElementById("modal-subtitle");
    const modalContent = document.getElementById("modal-content");

    // 根据入口统一打开添加连接弹窗，避免账号和 Key 共用错误表单。
    function openAddModal(step = "choose") {
      addModal.hidden = false;
      renderAddModal(step);
    }

    // 渲染类型选择、账号登录和 API Key 配置三个增量步骤。
    function renderAddModal(step) {
      if (step === "choose") {
        modalTitle.textContent = "添加连接";
        modalSubtitle.textContent = "选择要添加的连接类型";
        modalContent.innerHTML = `
          <div class="modal-options">
            <button class="modal-option" type="button" data-add-step="account"><span class="modal-option-icon">●</span><span><strong>ChatGPT 账号</strong><small>使用浏览器登录 Codex 账号</small></span><span class="modal-option-arrow">›</span></button>
            <button class="modal-option" type="button" data-add-step="key"><span class="modal-option-icon key">K</span><span><strong>API Key</strong><small>支持官方 OpenAI 和兼容中转站</small></span><span class="modal-option-arrow">›</span></button>
          </div>`;
        modalContent.querySelectorAll("[data-add-step]").forEach(button => button.addEventListener("click", () => renderAddModal(button.dataset.addStep)));
        return;
      }
      if (step === "account") {
        modalTitle.textContent = "添加 ChatGPT 账号";
        modalSubtitle.textContent = "登录完成后会保存账号连接，不会自动切换当前配置";
        modalContent.innerHTML = `
          <form class="modal-form" id="account-form">
            <div class="form-field"><label for="account-alias">别名（可选）</label><input id="account-alias" placeholder="例如：工作账号"></div>
            <p class="form-hint">点击继续后将在浏览器中完成 ChatGPT 登录。登录凭据不会显示在列表或日志中。</p>
            <div class="form-status" id="form-status"></div>
            <footer class="modal-footer"><button class="secondary-button" type="button" data-add-step="choose">返回</button><button class="primary-button" type="submit">打开浏览器登录</button></footer>
          </form>`;
        bindBackButton();
        document.getElementById("account-form").addEventListener("submit", event => { event.preventDefault(); document.getElementById("form-status").textContent = "示例：已完成登录，账号已添加。"; });
        return;
      }
      modalTitle.textContent = "添加 API Key";
      modalSubtitle.textContent = "支持官方 OpenAI API 和兼容中转站";
      modalContent.innerHTML = `
        <form class="modal-form" id="key-form">
          <div class="form-field"><label for="key-name">名称</label><input id="key-name" placeholder="例如：AI 系统" required></div>
          <div class="form-field"><label for="key-provider">服务类型</label><select id="key-provider"><option value="official">OpenAI 官方</option><option value="relay">兼容中转站</option></select></div>
          <div class="form-field" id="base-url-field" hidden><label for="key-base-url">API 地址</label><input id="key-base-url" placeholder="https://example.com/v1"><span class="form-hint">中转站地址必须明确配置；建议使用 HTTPS。</span></div>
          <div class="form-field"><label for="key-secret">API Key</label><input id="key-secret" type="password" placeholder="sk-..." required><span class="form-hint">密钥只保存到受保护认证文件，不进入列表、JSON 或日志。</span></div>
          <div class="form-field"><label for="balance-query">余额查询</label><select id="balance-query"><option>自动检测</option><option>不查询</option></select><span class="form-hint">接口不支持或查询失败时，列表中不显示余额。</span></div>
          <div class="form-status" id="form-status"></div>
          <footer class="modal-footer"><button class="secondary-button" type="button" data-add-step="choose">返回</button><button class="primary-button" type="submit">测试并添加</button></footer>
        </form>`;
      bindBackButton();
      const provider = document.getElementById("key-provider");
      const baseURL = document.getElementById("base-url-field");
      provider.addEventListener("change", () => { baseURL.hidden = provider.value !== "relay"; });
      document.getElementById("key-form").addEventListener("submit", event => { event.preventDefault(); document.getElementById("form-status").textContent = "示例：连接测试成功，Key 已添加。"; });
    }

    function bindBackButton() {
      modalContent.querySelector("[data-add-step=\"choose\"]")?.addEventListener("click", () => renderAddModal("choose"));
    }

    // 按认证类型返回稳定摘要，避免把 CPA 误展示成连接类型。
    function profileSummary(profile) {
      if (profile.kind === "apikey") return profile.balance ? `余额 ${profile.balance}` : "API Key";
      return profile.facts[0]?.[1] ?? profile.badge;
    }

    // 只用选中行颜色表达连接是否可用，避免重复展示当前配置和智能路由状态。
    function selectedStateClass(profile) {
      return profile.available ? "available" : "unavailable";
    }

    function filteredProfiles(type, query = "") {
      const normalized = query.trim().toLowerCase();
      return profiles.filter(profile => {
        const typeMatches = type === "all" || profile.kind === type;
        const queryMatches = !normalized || `${profile.name} ${profile.meta} ${profile.badge}`.toLowerCase().includes(normalized);
        return typeMatches && queryMatches;
      });
    }

    function renderMenu() {
      const pool = profiles.filter(profile => profile.inPool);
      availability.textContent = `${pool.filter(profile => profile.available).length} / ${pool.length} 个连接可用`;
      menuList.innerHTML = filteredProfiles(menuType.value).map(profile => `
        <button class="menu-row ${profile.id === selectedId ? `selected ${selectedStateClass(profile)}` : ""}" type="button" data-profile="${profile.id}">
          <span class="row-icon ${profile.kind}">${profile.kind === "chatgpt" ? "●" : profile.icon}</span>
          <span>
            <span class="row-title">${profile.name}<span class="badge ${profile.kind}">${profile.badge}</span></span>
            <span class="row-line">${profile.meta}</span>
            ${profile.menuLines.map(line => `<span class="row-line">${line}</span>`).join("")}
          </span>
        </button>`).join("");
      menuList.querySelectorAll("[data-profile]").forEach(button => {
        button.addEventListener("click", () => {
          selectedId = button.dataset.profile;
          profiles.forEach(profile => { profile.active = profile.id === selectedId; });
          renderMenu();
          renderWindow();
        });
      });
    }

    function renderWindow() {
      if (managementSection === "routing") {
        renderRouting();
        return;
      }
      const visible = filteredProfiles(windowType.value, windowSearch.value);
      if (!visible.some(profile => profile.id === selectedId) && visible[0]) selectedId = visible[0].id;
      windowList.innerHTML = visible.map(profile => `
        <button class="list-row ${profile.id === selectedId ? `selected ${selectedStateClass(profile)}` : ""}" type="button" data-window-profile="${profile.id}">
          <span class="list-row-head">${profile.name}<span class="badge ${profile.kind}">${profile.badge}</span></span>
          <small>${profile.meta}</small>
          <small>${profileSummary(profile)}</small>
        </button>`).join("");
      windowList.querySelectorAll("[data-window-profile]").forEach(button => {
        button.addEventListener("click", () => {
          selectedId = button.dataset.windowProfile;
          renderWindow();
          renderMenu();
        });
      });
      const selected = profiles.find(profile => profile.id === selectedId);
      renderDetail(selected);
    }

    // 渲染连接详情，并保持当前直连与智能池成员状态相互独立。
    function renderDetail(profile) {
      if (!profile) {
        windowDetail.innerHTML = "";
        return;
      }
      const facts = profile.facts.map(([label, value]) => `
        <span class="label">${label}</span><span class="value ${label === "余额" ? "balance" : ""}">${value}</span>`).join("");
      windowDetail.innerHTML = `
        <div class="profile">
          <span class="profile-avatar ${profile.kind}">${profile.kind === "chatgpt" ? profile.name.slice(0, 1) : "K"}</span>
          <div>
            <div class="profile-title"><h2>${profile.name}</h2><span class="badge ${profile.kind}">${profile.badge}</span></div>
            <p class="profile-subtitle">${profile.meta}</p>
          </div>
        </div>
        <div class="facts">${facts}</div>
        <div class="divider"></div>
        <div class="connection-heading"><span>直连配置</span><button class="${profile.active ? "secondary-button" : "primary-button"}" type="button" id="set-current">${profile.active ? "当前配置" : "设为当前"}</button></div>
        <div class="setting-row">
          <span class="setting-label"><strong>加入智能路由</strong><small>${profile.inPool ? "已加入 CPA 连接池" : "未加入 CPA 连接池"}</small></span>
          <label class="switch" aria-label="加入智能路由"><input id="smart-pool-toggle" type="checkbox" ${profile.inPool ? "checked" : ""}><span></span></label>
        </div>
        <label class="alias-label" for="alias-input">别名</label>
        <div class="alias-row"><input id="alias-input" value="${profile.name}"><button class="secondary-button" type="button">保存</button><button class="secondary-button" type="button">清除</button></div>
        <div class="detail-actions"><time>2026 年 8 月 2 日 15:15</time><div><button class="secondary-button" type="button">${profile.kind === "chatgpt" ? "重新登录" : "编辑 Key"}</button><button class="secondary-button" type="button">删除</button></div></div>`;
      document.getElementById("smart-pool-toggle").addEventListener("change", event => {
        profile.inPool = event.currentTarget.checked;
        renderWindow();
        renderMenu();
      });
      document.getElementById("set-current").addEventListener("click", () => {
        profiles.forEach(item => { item.active = item.id === profile.id; });
        renderWindow();
        renderMenu();
      });
    }

    // 汇总 CPA 连接状态与混合池成员，路由页不承担认证类型切换。
    function renderRouting() {
      const pool = profiles.filter(profile => profile.inPool);
      const availableCount = pool.filter(profile => profile.available).length;
      windowList.innerHTML = "";
      windowDetail.innerHTML = `
        <div class="routing-detail">
          <div class="routing-header">
            <div><h2>智能路由</h2><p>CPA 已连接</p></div>
            <button class="secondary-button" type="button">检查连接</button>
          </div>
          <div class="routing-metrics">
            <div class="routing-metric"><small>服务地址</small><strong>127.0.0.1:8317</strong></div>
            <div class="routing-metric"><small>策略</small><strong>轮询</strong></div>
            <div class="routing-metric"><small>会话黏性</small><strong>1 小时</strong></div>
            <div class="routing-metric"><small>可用连接</small><strong>${availableCount} / ${pool.length}</strong></div>
          </div>
          <div class="pool-heading">连接池</div>
          <div class="pool-table">
            ${pool.map(profile => `
              <div class="pool-row">
                <span class="pool-name"><strong>${profile.name}</strong><small>${profile.meta}</small></span>
                <span class="badge ${profile.kind}">${profile.kind === "chatgpt" ? "账号" : "Key"}</span>
                <span>${profileSummary(profile)}</span>
                <span class="health-dot" title="${profile.available ? "可用" : "冷却"}" style="background:${profile.available ? "var(--green)" : "var(--red)"}"></span>
              </div>`).join("")}
          </div>
        </div>`;
    }

    // 切换管理页时只调整现有分栏和工具栏，不创建新的连接管理层级。
    function selectManagementSection(section) {
      managementSection = section;
      const isRouting = section === "routing";
      windowBody.classList.toggle("routing", isRouting);
      managementTitle.textContent = isRouting ? "路由" : "连接";
      document.querySelectorAll("[data-connection-tool]").forEach(control => { control.hidden = isRouting; });
      document.querySelectorAll("[data-management-section]").forEach(button => {
        button.classList.toggle("active", button.dataset.managementSection === section);
      });
      renderWindow();
    }

    document.querySelectorAll("[data-page-button]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-page-button]").forEach(item => item.classList.toggle("active", item === button));
        document.querySelectorAll("[data-page]").forEach(page => page.classList.toggle("active", page.dataset.page === button.dataset.pageButton));
      });
    });
    document.querySelector("[data-open-management]").addEventListener("click", () => {
      document.querySelector("[data-page-button=\"management\"]").click();
    });
    document.querySelectorAll("[data-open-add]").forEach(button => button.addEventListener("click", () => openAddModal()));
    document.getElementById("modal-close").addEventListener("click", () => { addModal.hidden = true; });
    addModal.addEventListener("click", event => { if (event.target === addModal) addModal.hidden = true; });
    document.addEventListener("keydown", event => { if (event.key === "Escape") addModal.hidden = true; });
    document.querySelectorAll("[data-management-section]").forEach(button => {
      button.addEventListener("click", () => selectManagementSection(button.dataset.managementSection));
    });
    menuType.addEventListener("change", renderMenu);
    windowType.addEventListener("change", renderWindow);
    windowSearch.addEventListener("input", renderWindow);
    renderMenu();
    renderWindow();
    const initialPage = window.location.hash.slice(1);
    if (initialPage === "menu" || initialPage === "management") {
      document.querySelector(`[data-page-button="${initialPage}"]`).click();
    } else if (initialPage === "routing") {
      document.querySelector('[data-page-button="management"]').click();
      selectManagementSection("routing");
    }
  </script>
</body>
</html>
